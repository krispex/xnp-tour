<table id="myTable">
  <tr>
    <th (click)="sortTable(0)">Date</th>
    <th (click)="sortTable(1)">Course</th>
  </tr>
  <ng-container *ngFor="let course of courses">
    <tr *ngFor="let date of course.date; let i = index">
      <td>
        {{date}}
      </td>
      <td id="pointer" routerLink="/course/{{course.id}}/{{course.date[i]}}">
          {{course.name}}
      </td>
    </tr>
    
  </ng-container>
</table>

{{initializeTable(0)}}
